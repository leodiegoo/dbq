commands:
  prepare: "pnpm install --frozen-lockfile --config.strict-dep-builds=false"
test:
  prepare: true
  instructions: |
    Run commands directly, without the rtk prefix.
    dbq is a CLI with no server to start. Validate it by running the suite and the CLI.
    Dependencies are already installed by the prepare step.
    1. Run pnpm typecheck and pnpm test. The unit suite needs no database.
    2. Run the spec closest to the change: pnpm vitest run <file>.
       Guard changes (src/guards/): tests/guards/. Engine truncation or output: tests/output/.
       Config resolution: tests/config/. CLI behaviour: tests/cli/.
    3. For a CLI change, run node src/cli.ts --help or the changed subcommand's --help.
       Do not run dbq against configured projects. Guard behaviour is covered by tests/guards/.
    4. Real databases are optional. Only src/engines/ changes need one.
       The MySQL integration test needs a disposable server, never a shared one:
         docker run -d --rm --name dbq-nm-mysql -e MYSQL_ROOT_PASSWORD=pw -p 127.0.0.1:33999:3306 mysql:8.4
         Wait until the server accepts connections, then:
         DBQ_TEST_MYSQL_URI=mysql://root:pw@127.0.0.1:33999/mysql pnpm vitest run tests/engines/mysql.integration.test.ts
         docker rm -f dbq-nm-mysql
       Run at most one container at a time and remove it right after the run.
       If docker is not available, mark the engine change untested with that reason.
    There is no integration test for PostgreSQL, MongoDB or Redis. Mark engine changes for them untested.
    Never point dbq at a real or production database during validation.
