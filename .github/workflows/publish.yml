name: Publish

# Runs only when a GitHub release is published by hand. A normal push never triggers it.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install
        run: |
          pnpm install --frozen-lockfile --config.strict-dep-builds=false

      # The read-only guard suite gates every release.
      - name: Typecheck
        run: |
          pnpm typecheck

      - name: Test
        run: |
          pnpm test

      - name: Check the tag matches the package version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          pkg_version="$(node -p "require('./package.json').version")"
          test "$TAG" = "v$pkg_version" || { echo "tag $TAG does not match package.json version $pkg_version"; exit 1; }

      - name: Build and check the CLI version
        run: |
          pnpm build
          test "$(node dist/cli.js --version)" = "$(node -p "require('./package.json').version")"

      - name: Publish
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
