name: Release

# release-please opens and updates a release PR from Conventional Commits on main.
# Merging that PR creates the tag and GitHub release, and only then does the publish job run.
on:
  push:
    branches: ['main']

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write # tag and GitHub release
      pull-requests: write # release PR
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install
        run: |
          pnpm install --frozen-lockfile --config.strict-dep-builds=false

      # The read-only guard suite gates every release.
      - name: Typecheck
        run: |
          pnpm typecheck

      - name: Test
        run: |
          pnpm test

      - name: Build and check the CLI version
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          pnpm build
          test "$(node -p "require('./package.json').version")" = "$VERSION"
          test "$(node dist/cli.js --version)" = "$VERSION"

      - name: Publish
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
